name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 and ARM64 on every OS (macos-latest is Apple Silicon): ARM64 also runs the
        # hardware SHA-256 path that Sha224 uses where the CPU has it.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test with coverage
        run: >
          dotnet test -c Release --
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Test the netstandard2.0 build
        # The same tests, run against the netstandard2.0 library instead of the net10.0 one - that is
        # what .NET Framework and pre-net10 apps get. The AOT reference check is off because that
        # build isn't (and can't be) marked AOT-compatible.
        run: >
          dotnet test -c Release
          -p:ScarletOpenPgpLibraryTarget=netstandard2.0
          -p:VerifyReferenceAotCompatibility=false
          -p:VerifyReferenceTrimCompatibility=false

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/coverage.cobertura.xml
          if-no-files-found: error

  aot:
    # Publishing the test project as Native AOT fails on any trim/AOT warning
    # (IlcTreatWarningsAsErrors), then the native test executable runs the whole suite.
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish tests as Native AOT
        run: dotnet publish tests/Scarlet.OpenPgp.Tests -c Release -r ${{ matrix.rid }} -o out/tests

      - name: Run native tests
        # Test assets are resolved relative to the working directory.
        working-directory: out/tests
        run: ./Scarlet.OpenPgp.Tests

      - name: Publish CLI as Native AOT
        run: dotnet publish src/Scarlet.OpenPgp.Cli -c Release -r ${{ matrix.rid }} -o out/cli

      - name: Smoke-test CLI against the real Bun release signature
        run: bash .github/scripts/smoke-test-cli.sh out/cli/scarlet-openpgp

  aot-musl:
    # Alpine (musl). Native AOT for musl must be built on musl, and the CLI tool ships musl
    # packages: musl RIDs inherit from glibc ones, so without them Alpine would install the glibc
    # binary, which can't start there.
    name: Native AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-musl-x64
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Native AOT prerequisites
        shell: sh
        run: apk add --no-cache bash clang build-base zlib-dev git

      # Plain git rather than actions/checkout: JavaScript actions need the runner's Node.js,
      # which isn't available for Alpine on arm64.
      - name: Check out
        run: |
          git config --global --add safe.directory "*"
          git init -q .
          git fetch -q --depth 1 "${{ github.server_url }}/${{ github.repository }}" "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Publish tests as Native AOT
        run: dotnet publish tests/Scarlet.OpenPgp.Tests -c Release -r ${{ matrix.rid }} -o out/tests

      - name: Run native tests
        working-directory: out/tests
        run: ./Scarlet.OpenPgp.Tests

      - name: Publish CLI as Native AOT
        run: dotnet publish src/Scarlet.OpenPgp.Cli -c Release -r ${{ matrix.rid }} -o out/cli

      - name: Smoke-test CLI against the real Bun release signature
        run: bash .github/scripts/smoke-test-cli.sh out/cli/scarlet-openpgp
